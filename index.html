// Safe JSON.stringify polyfill to eliminate circular reference errors
(function() {
  var nativeStringify = JSON.stringify;
  JSON.stringify = function(value, replacer, space) {
    var seen = [];
    function safeReplacer(key, val) {
      if (val && typeof val === 'object') {
        if (seen.indexOf(val) !== -1) {
          return '[Circular]';
        }
        seen.push(val);
      }
      if (typeof replacer === 'function') {
        return replacer(key, val);
      }
      if (Array.isArray(replacer)) {
        if (key !== '' && replacer.indexOf(key) === -1) {
          return undefined;
        }
      }
      return val;
    }
    try {
      return nativeStringify(value, safeReplacer, space);
    } catch (e) {
      try {
        return nativeStringify(String(value));
      } catch (e2) {
        return '"[Unserializable]"';
      }
    }
  };

  // Safe global error handler to sanitize complex or circular error objects
  window.addEventListener('error', function(event) {
    if (event.error && typeof event.error === 'object') {
      try {
        JSON.stringify(event.error);
      } catch (e) {
        event.preventDefault();
        console.error('Sanitized circular uncaught error:', event.error.message || event.error);
      }
    }
  }, true);

  window.addEventListener('unhandledrejection', function(event) {
    if (event.reason && typeof event.reason === 'object') {
      try {
        JSON.stringify(event.reason);
      } catch (e) {
        event.preventDefault();
        console.error('Sanitized circular unhandled promise rejection:', event.reason.message || event.reason);
      }
    }
  }, true);
})();

  gap: 15px;
}
.loading-overlay.show { display: flex !important; }
.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #f3f3f3;
  border-top: 5px solid var(--ijef-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* UTILS */
.text-green { color: #065f46 !important; } /* Darker green for better contrast */
.text-red { color: #b91c1c !important; }   /* Darker red for better contrast */
.text-blue { color: #1a237e !important; }
.bg-blue { background: #1a237e !important; color: white !important; }
.bg-blue td, .bg-blue th { color: white !important; }
.fw-bold { font-weight: 700 !important; }

/* PORTAL KOMUNIKASI (CHAT) */
.chat-container {
  display: flex;
  height: calc(100vh - 250px);
  min-height: 500px;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border: 1px solid #e2e8f0;
}
.chat-sidebar {
  width: 260px;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  background: #f8fafc;
}
.chat-sidebar-header {
  padding: 16px;
  font-weight: 700;
  border-bottom: 1px solid #e2e8f0;
  background: white;
  font-size: 0.85rem;

}
.chat-user-list {
  flex: 1;
  overflow-y: auto;
}
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: white;
  min-width: 0;
}
.chat-msg-list {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #ffffff;
}
.chat-bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: 85%;
}
.chat-bubble-wrap.me { align-self: flex-end; align-items: flex-end; }
.chat-bubble-wrap.other { align-self: flex-start; align-items: flex-start; }

.chat-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 0.88rem;
  line-height: 1.5;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  word-break: break-word;
}
.me .chat-bubble { background: #1a237e; color: white; border-bottom-right-radius: 2px; }
.other .chat-bubble { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 2px; }

.chat-meta { font-size: 0.62rem; color: #94a3b8; margin-top: 3px; font-weight: 600; }
.chat-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 0.75rem;
  flex-shrink: 0;
}
.chat-user-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid #f1f5f9;
  transition: all 0.2s;
}
.chat-user-item:hover { background: #f1f5f9; }
.chat-user-item.active { background: #eef2ff; border-left: 4px solid #1a237e; }

.chat-quick-templates {
  padding: 8px 16px;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.chat-quick-label { font-size: 0.7rem; color: #64748b; font-weight: 600; }

.chat-input-area {
  padding: 12px 16px;
  background: white;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 10px;
  align-items: center;
}
.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  font-size: 0.9rem;
}
.chat-attachment-btn { padding: 10px !important; border-radius: 10px !important; }
.chat-send-btn { padding: 10px 20px !important; border-radius: 10px !important; font-weight: 700 !important; }

@media (max-width: 768px) {
  .chat-container { height: calc(100vh - 220px); flex-direction: column; min-height: 400px; }
  .chat-sidebar { width: 100%; height: 50px; border-right: none; border-bottom: 1px solid #e2e8f0; overflow-x: auto; flex-direction: row; flex-shrink: 0; }
  .chat-sidebar-header { display: none; }
  .chat-user-list { display: flex; flex-direction: row; }
  .chat-user-item { padding: 5px 10px; border-bottom: none; border-right: 1px solid #f1f5f9; white-space: nowrap; }
  .chat-bubble-wrap { max-width: 90%; }
  .chat-input-area { padding: 10px; gap: 6px; }
  .chat-send-btn { padding: 8px 14px !important; font-size: 0.8rem !important; }
}
.text-right { text-align: right !important; }
.text-muted { color: #888; font-size: 0.82rem; }
.flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mt-12 { margin-top: 12px; }
.hamburger { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 4px; display: block; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; background: var(--ijef-primary-light); color: var(--ijef-primary); font-weight: 600; }

</style>
</head>

<script>
function handleResize() {
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.remove('orientation-portrait', 'orientation-landscape');
  document.body.classList.add(isPortrait ? 'orientation-portrait' : 'orientation-landscape');

  if (window.innerWidth <= 600) {
    document.body.classList.add('preview-mode-mobile');
    document.body.classList.remove('preview-mode-tablet', 'preview-mode-desktop');
  } else if (window.innerWidth <= 1024) {
    document.body.classList.add('preview-mode-tablet');
    document.body.classList.remove('preview-mode-mobile', 'preview-mode-desktop');
  } else {
    document.body.classList.add('preview-mode-desktop');
    document.body.classList.remove('preview-mode-mobile', 'preview-mode-tablet');
  }

  window.dispatchEvent(new Event('resize-charts'));
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(handleResize, 450));
window.addEventListener('load', function() {
  handleResize();
  setTimeout(() => {
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.remove('show');
  }, 3000);
});
function togglePwd(id, btn) {
  var x = document.getElementById(id);
  if (x.type === "password") { x.type = "text"; btn.innerText = "🙈"; }
  else { x.type = "password"; btn.innerText = "👁"; }
}
</script>
